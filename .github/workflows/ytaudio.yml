name: ytaudio APK

on:
  push:
    paths:
      - 'ytaudio/**'
      - '.github/workflows/ytaudio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: ytaudio
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename
        run: cp ytaudio/app/build/outputs/apk/release/app-release.apk ytaudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ytaudio-apk
          path: ytaudio.apk
